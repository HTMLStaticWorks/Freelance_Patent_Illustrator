<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PatentDraft Professional Illustration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <div class="auth-split-wrapper">
        <!-- Left Side: Visual & Branding -->
        <div class="auth-split-left">
            <div class="auth-logo-large animate-slide-up">
                <div class="mb-4">
                    <svg width="80" height="80" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="25" cy="25" r="22" stroke="white" stroke-width="1" stroke-dasharray="2 2"
                            opacity="0.3" />
                        <path d="M25 10L15 40H20L25 25L30 40H35L25 10Z" fill="white" />
                        <path d="M25 20L22 30L25 35L28 30L25 20Z" fill="rgba(255,255,255,0.8)" />
                    </svg>
                </div>
                <h1>PATENT<br>DRAFTING</h1>
                <p>Patent Illustration Services</p>
            </div>
        </div>

        <!-- Right Side: Registration Form -->
        <div class="auth-split-right">
            <!-- Top Toggles -->
            <div class="auth-top-controls">
                <button class="btn btn-sm btn-outline-dark rounded-0" id="themeToggle"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <button class="btn btn-sm btn-outline-dark fw-bold px-3 rounded-0" id="rtlToggle"
                    style="height: 40px;">
                    RTL
                </button>
            </div>

            <div class="auth-form-container animate-fade-in text-center" style="max-width: 500px;">
                <!-- Form Logo -->
                <a href="index.html" class="auth-form-logo d-inline-block">
                    <svg width="180" height="45" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg"
                        dir="ltr">
                        <g transform="translate(0,2)">
                            <circle cx="22" cy="23" r="18" stroke="var(--logo-guide)" stroke-width="1.5"
                                stroke-dasharray="3 3" />
                            <path d="M22 6L10 40H16L22 22L28 40H34L22 6Z" fill="var(--logo-shape)" />
                            <path d="M22 16L18 28L22 33L26 28L22 16Z" fill="var(--logo-nib)" />
                            <circle cx="22" cy="27" r="1.8" fill="var(--logo-dot)" />
                        </g>
                        <text x="44" y="32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"
                            letter-spacing="0.5" fill="var(--logo-text-1)">PATENT</text>
                        <text x="125" y="32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"
                            letter-spacing="0.5" fill="var(--logo-text-2)">DRAFT</text>
                    </svg>
                </a>
                <h3 class="fw-bold mb-4">Create Your Account</h3>

                <form action="dashboard.html" class="text-start">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold small">Full Name</label>
                            <div class="input-group-auth">
                                <i class="bi bi-person"></i>
                                <input type="text" class="form-control border" placeholder="John Doe" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small">Account Type</label>
                            <div class="d-flex gap-3">
                                <div class="flex-fill">
                                    <input type="radio" class="btn-check" name="role" id="roleInventor"
                                        autocomplete="off" checked>
                                    <label class="btn btn-outline-dark w-100 py-3 rounded-2 fw-bold"
                                        for="roleInventor">INVENTOR</label>
                                </div>
                                <div class="flex-fill">
                                    <input type="radio" class="btn-check" name="role" id="roleAttorney"
                                        autocomplete="off">
                                    <label class="btn btn-outline-dark w-100 py-3 rounded-2 fw-bold"
                                        for="roleAttorney">ATTORNEY</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small">Email Address</label>
                            <div class="input-group-auth">
                                <i class="bi bi-envelope"></i>
                                <input type="email" class="form-control border" placeholder="john.doe@example.com"
                                    required>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small">Create Password</label>
                            <div class="input-group-auth">
                                <i class="bi bi-lock"></i>
                                <input type="password" class="form-control border" placeholder="••••••••" required>
                                <button type="button" class="btn-eye">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold small">Confirm Password</label>
                            <div class="input-group-auth">
                                <i class="bi bi-shield-lock"></i>
                                <input type="password" class="form-control border" placeholder="••••••••" required>
                                <button type="button" class="btn-eye">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="my-4 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small" for="terms">I agree to the <a href="#"
                                class="text-primary fw-bold text-decoration-none">Terms of Service</a></label>
                    </div>

                    <button type="submit" class="btn btn-signin w-100 mb-2">Initialize Account</button>

                    <div class="auth-divider">Or sign up with</div>

                    <div class="d-flex flex-column gap-2 mb-4">
                        <a href="#" class="btn-social">
                            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google"
                                width="20">
                            Sign up with Google
                        </a>
                        <a href="#" class="btn-social">
                            <i class="bi bi-apple fs-5"></i>
                            Sign up with Apple
                        </a>
                    </div>

                    <div class="text-center">
                        <p class="small text-secondary mb-0">Already have an account? <a href="login.html"
                                class="text-primary fw-bold text-decoration-none">Sign in here</a></p>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Back to Top Button -->
    <button id="backToTop" class="back-to-top" title="Back to Top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
